name: Release

# Publishes a GitHub Release (semver vMAJOR.MINOR.PATCH) with cross-compiled
# binaries and auto-generated release notes.
#
# Versioning:
#   - MAJOR.MINOR is read from the committed VERSION file and bumped MANUALLY
#     (edit VERSION in a PR when you want a minor/major release).
#   - PATCH auto-increments from the existing git tags on that MAJOR.MINOR line,
#     starting at 1. So the first release is v0.0.1, then v0.0.2, ...; bumping
#     VERSION to 0.1 restarts the line at v0.1.1.
#
# Runs when a merge to main changes the binary — the command or its internal
# packages, the module files, or the VERSION file (for a manual minor/major
# bump). Docs- or CI-config-only merges don't cut a release. Can also be run
# on demand from the Actions tab (workflow_dispatch) to publish the next patch.
on:
  push:
    branches: [main]
    paths:
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - 'VERSION'
  workflow_dispatch: {}

permissions:
  contents: write # create tags and releases

# Never run two releases at once; don't cancel an in-flight publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: build & release
    runs-on: ubuntu-latest
    # A job-level block REPLACES the workflow-level one rather than adding to
    # it, so contents:write is restated here — dropping it would leave
    # `gh release create` unable to create the release it is here to publish.
    permissions:
      contents: write # create tags and releases
      id-token: write # mint the OIDC token the provenance attestation is signed with
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      published: ${{ steps.guard.outputs.exists == 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # full history + tags for versioning and release notes

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          major_minor="$(tr -d ' \t\n\r' < VERSION)"
          if ! printf '%s' "$major_minor" | grep -Eq '^[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must contain MAJOR.MINOR (e.g. 0.0); got '$major_minor'"
            exit 1
          fi
          git fetch --tags --force
          latest_patch="$(git tag -l "v${major_minor}.*" \
            | sed -E "s/^v${major_minor}\.//" \
            | grep -E '^[0-9]+$' \
            | sort -n | tail -1 || true)"
          if [ -z "${latest_patch:-}" ]; then
            patch=1
          else
            patch=$((latest_patch + 1))
          fi
          tag="v${major_minor}.${patch}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

      - name: Skip if already released
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.ver.outputs.tag }}" >/dev/null 2>&1; then
            echo "::notice::${{ steps.ver.outputs.tag }} already exists; skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        if: steps.guard.outputs.exists == 'false'
        run: |
          set -euo pipefail
          TAG="${{ steps.ver.outputs.tag }}"
          mkdir -p dist
          for p in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${p%/*}"; arch="${p#*/}"
            bin="codeowners-tool"
            [ "$os" = "windows" ] && bin="codeowners-tool.exe"
            name="codeowners-tool_${TAG}_${os}_${arch}"
            mkdir -p "dist/$name"
            # -X stamps the tag into the binary so `codeowners-tool version`
            # answers with the build it is, not with "dev". A fleet that cannot
            # be asked which build it is running makes both rollback and CVE
            # response guesswork.
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath \
              -ldflags "-s -w -X github.com/jordonpeterson/codeowners-tool/internal/cli.Version=${TAG}" \
              -o "dist/$name/$bin" ./cmd/codeowners-tool
            cp LICENSE NOTICE README.md "dist/$name/"
            if [ "$os" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "$name")
            else
              tar -czf "dist/${name}.tar.gz" -C dist "$name"
            fi
            rm -rf "dist/$name"
          done
          (cd dist && sha256sum ./*.tar.gz ./*.zip > checksums.txt)
          ls -la dist

      # checksums.txt lives on the same release as the archives it covers and is
      # fetched by install.sh over the same channel from the same host, so it
      # proves integrity in transit and nothing about ORIGIN: whoever can write
      # the release rewrites the archives and the checksums in one step, and
      # every downstream check still passes. Homebrew inherits that, because
      # tools/gen-formula.sh reads its sha256 values out of that same file.
      #
      # A build-provenance attestation is signed with a short-lived OIDC identity
      # for this workflow in this repository, so `gh attestation verify` answers
      # "was this built HERE, by THIS workflow" — a question no hash on the
      # release can answer. It runs BEFORE the release is created: an attestation
      # failure should mean no release exists, not a published release nobody can
      # verify.
      - name: Attest build provenance
        if: steps.guard.outputs.exists == 'false'
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Create release
        if: steps.guard.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.ver.outputs.tag }}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes

  # Bumps the Homebrew formula in jordonpeterson/homebrew-tap to the new
  # release. Inactive until a HOMEBREW_TAP_TOKEN secret (a PAT/fine-grained
  # token with contents:write on the tap repo) is added — without it this job
  # logs a notice and exits cleanly, and the formula must be bumped by hand.
  homebrew:
    name: bump homebrew tap
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    # All this job does to THIS repository is read tools/gen-formula.sh; it writes
    # only to the tap, with its own PAT. Without this block it inherits the
    # workflow-level contents: write — a job-level block REPLACES the
    # workflow-level one — and any step here could rewrite releases.
    permissions:
      contents: read # read tools/gen-formula.sh; the tap is written with TAP_TOKEN
    steps:
      - name: Checkout (for tools/gen-formula.sh)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # No Actions token in .git/config: this job runs a shell script and a
          # second git remote, and neither needs credentials for this repository.
          persist-credentials: false

      - name: Update tap formula
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_TOKEN:-}" ]; then
            echo "::notice::HOMEBREW_TAP_TOKEN not set — skipping Homebrew formula bump for ${TAG}."
            exit 0
          fi
          curl -fsSL "https://github.com/jordonpeterson/codeowners-tool/releases/download/${TAG}/checksums.txt" -o checksums.txt
          # The token goes to gh's credential helper, never into a URL. Cloning
          # from https://x-access-token:TOKEN@github.com/... wrote the PAT in
          # cleartext into tap/.git/config and into any git error echoing the
          # remote. Actions masks secrets in its own log lines, but this value has
          # been through a shell, and git's config is not masked at all.
          echo "${TAP_TOKEN}" | gh auth login --with-token
          gh auth setup-git
          git clone --depth 1 "https://github.com/jordonpeterson/homebrew-tap.git" tap
          sh tools/gen-formula.sh "${TAG}" checksums.txt > tap/Formula/codeowners-tool.rb
          cd tap
          if git diff --quiet; then
            echo "::notice::Formula already up to date for ${TAG}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "codeowners-tool ${TAG#v}"
          git push
