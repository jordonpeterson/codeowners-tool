name: CI

# Runs on every pull request and on merges (pushes) to main, so tests must
# pass both before and after a change lands on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet & gofmt check
        run: make vet

      - name: Test
        run: go test -race ./...

      # docs/BEHAVIOR.md is generated from the test suite's doc comments, so
      # it can only stay true if every change regenerates it. Adding, renaming
      # or re-documenting a test without running `make docs` fails here.
      - name: Docs up to date
        run: make docs-check

      - name: Build
        run: make build

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck scripts
        run: shellcheck install.sh tools/gen-formula.sh

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color
