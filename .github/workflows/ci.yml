name: CI

# Runs on every pull request and on merges (pushes) to main, so tests must
# pass both before and after a change lands on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet & gofmt check
        run: make vet

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build

  docs:
    name: docs are not stale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # docs/BEHAVIOR.md is generated from the test doc comments, so a change
      # to a test that is not regenerated is documentation drift. Regenerate
      # and fail if the committed file differs from what the tests produce.
      - name: Regenerate docs
        run: make docs

      - name: Check docs/BEHAVIOR.md is up to date
        run: |
          git diff --exit-code docs/BEHAVIOR.md \
            || (echo "docs/BEHAVIOR.md is stale: run 'make docs' and commit the result" && exit 1)

  # Catches drift between the matcher and the hmarr/codeowners oracle it was
  # ported from. Its own job, so 35s of fuzz stays off the critical path. The seed
  # is fixed because a gate drawing new inputs each run fails on PRs that changed
  # nothing; `go run ./tools/difftest 500000 <seed>` is how you look elsewhere.
  difftest:
    name: differential fuzz vs hmarr oracle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Differential fuzz (500k cases, fixed seed)
        run: go run ./tools/difftest 500000

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck scripts
        run: shellcheck install.sh tools/gen-formula.sh tools/fleet/co-own.sh tools/action/setup.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # actionlint needs a newer Go than the one this project builds with, and
      # setup-go pins GOTOOLCHAIN=local from v6 on — which turns that mismatch
      # into a hard install failure. Only this step opts out: `go install` may
      # fetch the toolchain the tool asks for, while every step that builds or
      # tests the project stays on the version go.mod names.
      - name: Install actionlint
        env:
          GOTOOLCHAIN: auto
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

  # tools/action drives setup.sh against a stub install.sh, which proves the
  # handoff and nothing about the download. This job is the other half: the
  # action as a consumer's workflow uses it, against real releases, on both
  # platforms it claims to support.
  action:
    name: action installs a verified release
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      attestations: read # `gh attestation verify` reads the release's signed statement
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # PROVENANCE=require, not the default: gh is on every hosted runner and the
      # action hands it a token, so this is the one place the check can always
      # run — and an unverifiable release is a release-integrity failure worth
      # going red for.
      - name: Install the latest release
        id: latest
        uses: ./
        with:
          provenance: require

      - name: The binary on the PATH is the build the action reported
        run: |
          set -euo pipefail
          test -n "${{ steps.latest.outputs.version }}"
          test "$(codeowners-tool version)" = "${{ steps.latest.outputs.version }}"
          test "$(command -v codeowners-tool)" = "${{ steps.latest.outputs.path }}"
          codeowners-tool --help >/dev/null

      # A pinned version has to install that exact build, not the newest one.
      # v0.0.9 is a published release and releases are immutable, so this asserts
      # a constant rather than whatever main happens to be at.
      - name: A pinned version installs that build
        uses: ./
        with:
          version: v0.0.9

      - name: The pin was honored
        run: |
          set -euo pipefail
          test "$(codeowners-tool version)" = v0.0.9
