name: CI

# Runs on every pull request and on merges (pushes) to main, so tests must
# pass both before and after a change lands on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet & gofmt check
        run: make vet

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build

  docs:
    name: docs are not stale
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      # docs/BEHAVIOR.md is generated from the test doc comments, so a change
      # to a test that is not regenerated is documentation drift. Regenerate
      # and fail if the committed file differs from what the tests produce.
      - name: Regenerate docs
        run: make docs

      - name: Check docs/BEHAVIOR.md is up to date
        run: |
          git diff --exit-code docs/BEHAVIOR.md \
            || (echo "docs/BEHAVIOR.md is stale: run 'make docs' and commit the result" && exit 1)

  # The strongest correctness evidence in the repository — the matcher is a port
  # of hmarr/codeowners and this catches porting drift byte-for-byte — and until
  # now it ran only when somebody remembered to type `make diff-test`.
  #
  # Its own job, so it runs in parallel: 500k cases take ~35s, so there was no
  # reason to run a reduced count. The seed is fixed because a gate that draws new
  # inputs each run fails on PRs that changed nothing, and a gate people re-run
  # until it goes green is not a gate. The cost is one fixed region of the input
  # space forever; `go run ./tools/difftest 500000 <seed>` is how you look
  # elsewhere, which is worth doing when touching the matcher.
  difftest:
    name: differential fuzz vs hmarr oracle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Differential fuzz (500k cases, fixed seed)
        run: go run ./tools/difftest 500000

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: ShellCheck scripts
        run: shellcheck install.sh tools/gen-formula.sh

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Install actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color
