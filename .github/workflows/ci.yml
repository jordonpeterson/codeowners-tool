name: CI

# Runs on every pull request and on merges (pushes) to main, so tests must
# pass both before and after a change lands on the default branch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet & gofmt check
        run: make vet

      - name: Test
        run: go test -race ./...

      - name: Build
        run: make build
